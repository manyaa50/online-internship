{% extends "base.html" %}

{% block title %}Log In - Smart Online Internship System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-block fs-3 mb-2">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your student, company, or administrator account</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@domain.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <!-- Demo Credentials Quick Fill Box for Examination / Viva -->
                <div class="mt-4 pt-3 border-top">
                    <p class="small text-muted fw-semibold text-center mb-2">
                        <i class="bi bi-lightning-charge text-warning me-1"></i> Quick Test Credentials (Click to Autofill):
                    </p>
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-outline-danger btn-sm text-start py-1" onclick="fillDemoCredentials('admin@smartintern.com', 'Admin@12345')">
                            <span class="badge bg-danger me-1">Admin</span> admin@smartintern.com / Admin@12345
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm text-start py-1" onclick="fillDemoCredentials('student@smartintern.com', 'Student@12345')">
                            <span class="badge bg-primary me-1">Student</span> student@smartintern.com / Student@12345
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm text-start py-1" onclick="fillDemoCredentials('hr@technovaglobal.com', 'Company@12345')">
                            <span class="badge bg-success me-1">Company</span> hr@technovaglobal.com / Company@12345
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
